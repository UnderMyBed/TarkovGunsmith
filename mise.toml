# Toolchain pin for this repo. mise reads this on `cd` into the directory.
#
# All three of these values are held together by tests in packages/repo-guards:
#   node  MUST equal .nvmrc                     (CI reads .nvmrc via actions/setup-node)
#   pnpm  MUST equal package.json packageManager
#
# CI deliberately still uses .nvmrc rather than jdx/mise-action — see the spec's
# "CI is deliberately left alone" note. If CI ever moves to mise, .nvmrc retires
# and the node guard goes with it.
[tools]
node = "22"
pnpm = "10.34.5"

# Workflow linting. Not in CI — the repo-guards suite is the enforced gate — but the
# security runbook and the alerting plan both tell you to run `mise exec -- actionlint`,
# and an instruction that errors on a missing shim is an instruction nobody follows.
# actionlint shells out to shellcheck for every `run:` block, so both must be pinned.
actionlint = "1.7.12"
shellcheck = "0.11.0"
