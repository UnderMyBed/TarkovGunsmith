apiVersion: syntheticmonitoring.ext.grafana.app/v1alpha1
kind: Check
metadata:
  name: tarkovgunsmith-api
spec:
  job: tarkovgunsmith-api
  target: https://api.tarkovgunsmith.undermybed.dev/healthz
  frequency: 300000
  timeout: 10000
  enabled: true
  probes:
    - Atlanta
  alertSensitivity: none
  basicMetricsOnly: true
  labels:
    - name: project
      value: tarkovgunsmith
  settings:
    http:
      method: GET
      validStatusCodes: [200]
      failIfNotSSL: true
      failIfBodyNotMatchesRegexp: ["^ok$"]
