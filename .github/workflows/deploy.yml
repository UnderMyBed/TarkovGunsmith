name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builds-api:
    name: Deploy builds-api Worker
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-builds-api
      cancel-in-progress: false
    environment:
      name: production-builds-api
      url: https://tarkov-gunsmith-builds-api.workers.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (verify bundle)
        run: pnpm --filter @tarkov/builds-api build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/builds-api
          command: deploy

  pages:
    name: Deploy web (Cloudflare Pages)
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: production-pages
      url: https://tarkov-gunsmith-web.pages.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SPA (and its workspace deps)
        # ...build = include the workspace packages @tarkov/web depends on
        # (@tarkov/data, @tarkov/ui, @tarkov/types). Without this, vite/tsc
        # can't resolve the workspace imports because their dist/ is missing.
        run: pnpm --filter "@tarkov/web..." build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy ./dist --project-name=tarkov-gunsmith-web --branch=main
