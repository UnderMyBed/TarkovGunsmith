name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builds-api:
    name: Deploy builds-api Worker
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-builds-api
      cancel-in-progress: false
    environment:
      name: production-builds-api
      url: https://api.tarkovgunsmith.undermybed.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Via turbo, NOT `pnpm --filter @tarkov/builds-api build`. The worker gained its first
      # workspace dependency (@tarkov/data, for schema validation) and a plain pnpm filter
      # builds only the named package — so wrangler bundled against a @tarkov/data with no
      # dist/ and failed on `Could not resolve "@tarkov/data/schemas"`. CI never caught it
      # because `pnpm build` at the root goes through turbo, whose build task declares
      # dependsOn: ["^build"]. Deploy is the only place that filtered to one package.
      - name: Build (verify bundle)
        run: pnpm turbo run build --filter=@tarkov/builds-api

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/builds-api
          command: deploy

  pages:
    name: Deploy web (Cloudflare Pages)
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    environment:
      name: production-pages
      url: https://tarkovgunsmith.undermybed.dev
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build SPA (and its workspace deps)
        # ...build = include the workspace packages @tarkov/web depends on
        # (@tarkov/ballistics, @tarkov/data, @tarkov/og, @tarkov/optimizer,
        # @tarkov/ui). Without this, vite/tsc can't resolve the workspace
        # imports because their dist/ is missing.
        run: pnpm --filter "@tarkov/web..." build

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy ./dist --project-name=tarkov-gunsmith-web --branch=main

      # Declared here rather than clicked in the dashboard, for the same reason the Worker's
      # route now lives in wrangler.jsonc: infrastructure nobody can see from the repo is
      # infrastructure that disappears without anyone noticing.
      #
      # Idempotency is a LIST-then-CREATE, not a create-and-forgive. The first version keyed
      # off the error body and broke on the second run: re-adding an existing domain returns
      # HTTP 400 with code 8000018 ("You have already added this custom domain"), which is
      # neither the 409 nor the message text it was matching. Asking what exists is stable;
      # pattern-matching another service's error strings is not.
      - name: Ensure the Pages custom domain exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: tarkov-gunsmith-web
          SITE_HOST: tarkovgunsmith.undermybed.dev
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN")

          if curl -sS "${auth[@]}" "$api" \
             | jq -e --arg h "$SITE_HOST" '.result[]? | select(.name == $h)' >/dev/null 2>&1; then
            echo "custom domain already attached: $SITE_HOST"
            exit 0
          fi

          code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' -X POST "$api" \
            "${auth[@]}" -H 'content-type: application/json' \
            --data "{\"name\":\"$SITE_HOST\"}")
          if [ "$code" = "200" ]; then
            echo "attached custom domain: $SITE_HOST"
          else
            echo "FAILED to attach custom domain (HTTP $code):"; cat /tmp/domain.json; exit 1
          fi

      # Registering the hostname with the Pages project and pointing DNS at it are two
      # separate operations. The dashboard's "add a custom domain" flow does both, which is
      # why this is easy to miss: the first deploy after adding the domain returned
      # `POST domains -> HTTP 200` and the site still did not resolve, because the zone had
      # no record for it at all. Same lesson as the Worker's route — infrastructure that
      # only exists because someone clicked it is infrastructure nobody can rebuild.
      - name: Ensure the site's DNS record exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_NAME: undermybed.dev
          SITE_HOST: tarkovgunsmith.undermybed.dev
          PAGES_HOST: tarkov-gunsmith-web.pages.dev
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CF_API_TOKEN")

          zone_id=$(curl -sS "${auth[@]}" "$api/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo "Could not read the zone id for $ZONE_NAME."
            echo "The API token needs Zone -> Zone -> Read in addition to Zone -> DNS -> Edit."
            exit 1
          fi

          existing=$(curl -sS "${auth[@]}" \
            "$api/zones/$zone_id/dns_records?name=$SITE_HOST" | jq -r '.result[0].id // empty')
          if [ -n "$existing" ]; then
            echo "DNS record already present for $SITE_HOST"
            exit 0
          fi

          # Proxied, so the record resolves to Cloudflare's edge and the Pages project is
          # served through it. An unproxied CNAME to *.pages.dev does not serve the project.
          code=$(curl -sS -o /tmp/dns.json -w '%{http_code}' -X POST "$api/zones/$zone_id/dns_records" \
            "${auth[@]}" -H 'content-type: application/json' \
            --data "{\"type\":\"CNAME\",\"name\":\"$SITE_HOST\",\"content\":\"$PAGES_HOST\",\"proxied\":true}")
          if [ "$code" = "200" ]; then
            echo "created CNAME $SITE_HOST -> $PAGES_HOST (proxied)"
          else
            echo "FAILED to create the DNS record (HTTP $code):"; cat /tmp/dns.json; exit 1
          fi

  smoke:
    name: Post-deploy smoke
    needs: [builds-api, pages]
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    steps:
      # A deploy that reports success while its own API 500s is exactly what shipped for
      # months. This job is the difference between "wrangler exited 0" and "production
      # works". It deliberately probes through the Pages proxy, not the Worker directly,
      # because the proxy hop is the part that was broken.
      - name: Probe production
        env:
          SITE: https://tarkovgunsmith.undermybed.dev
          API: https://api.tarkovgunsmith.undermybed.dev
        run: |
          set -euo pipefail
          fail=0

          # Retries ONLY on connection- and certificate-shaped failures. The first deploy
          # onto a brand-new custom domain fails here for a minute or two while Cloudflare
          # provisions the edge certificate: DNS resolves, TLS does not complete yet, and
          # curl reports 000. That is not a broken deploy and must not be reported as one.
          #
          # A real wrong status — 500 because the edge cannot reach the Worker, 404 because
          # a route vanished — breaks out immediately. Retrying those would only delay a
          # failure the gate exists to surface, so the distinction is load-bearing.
          probe() { # name, expected, url, extra curl args...
            local name="$1" expect="$2" url="$3"; shift 3
            local code deadline=$((SECONDS + 420))
            while :; do
              # `-w` already prints 000 when the transfer never completes, so the exit code
              # is swallowed rather than turned into a second value. An earlier version
              # appended its own "000" and reported the code as "000000".
              code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$@" "$url" 2>/dev/null || true)
              [ -n "$code" ] || code=000
              [ "$code" = "$expect" ] && break
              case "$code" in
                000|502|503|521|522|523|525|526) ;;   # not serving yet — keep waiting
                *) break ;;                            # a real answer, and the wrong one
              esac
              [ "$SECONDS" -ge "$deadline" ] && break
              echo "  ...  $name -> $code, retrying (cert/DNS may still be provisioning)"
              sleep 20
            done
            if [ "$code" = "$expect" ]; then
              echo "  ok   $name -> $code"
            else
              echo "  FAIL $name -> $code (expected $expect)"; head -c 200 /tmp/body; echo; fail=1
            fi
          }

          echo "site:"
          probe "GET /"            200 "$SITE/"
          probe "GET /builder"     200 "$SITE/builder"

          echo "worker reachable on its own hostname:"
          probe "GET api /healthz" 200 "$API/healthz"

          # The load-bearing one. An invalid body must reach the Worker and come back 400.
          # A 500 here means the edge could not reach the Worker at all -- the exact
          # failure that made build sharing dead in production while CI stayed green.
          echo "edge -> worker path:"
          probe "POST /api/builds (invalid body)" 400 "$SITE/api/builds" \
            -X POST -H 'content-type: application/json' --data '{}'
          probe "GET /api/builds/zzzzzzzz" 404 "$SITE/api/builds/zzzzzzzz"

          [ "$fail" = "0" ] || { echo; echo "Production is not serving correctly."; exit 1; }
          echo; echo "production verified"
