version: 2
updates:
  # Root ONLY. Do not add "/apps/*" or "/packages/*" here — packages/repo-guards fails the
  # build if you do, and this repo already learned why the hard way.
  #
  # A pnpm workspace keeps ONE pnpm-lock.yaml, at the root. An update job launched inside
  # /apps/web has no lockfile in scope, so it rewrites the manifest, leaves the lockfile
  # alone, and every resulting PR dies in CI on ERR_PNPM_OUTDATED_LOCKFILE. That is exactly
  # what happened on Dependabot's first run here (2026-08-18): all 7 npm PRs failed, while
  # the github-actions PRs — no lockfile involved — were green.
  #
  # Root-only does NOT mean members go unwatched. Dependabot reads pnpm-workspace.yaml and
  # discovers apps/* and packages/* itself, updating the member manifest and the root
  # lockfile in one PR. Per dependabot-core's maintainers, listing both root and
  # subdirectories is the documented misconfiguration:
  # https://github.com/dependabot/dependabot-core/pull/11487
  #
  # The github-actions entry below is the genuine exception, not an inconsistency: it has
  # no lockfile and no workspace file, so `directory: /` really does see only
  # .github/workflows/ and composite actions really do need their own entries.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Counts OPEN npm PRs. A backlog of stale ones consumes every slot and blocks Dependabot
    # from opening correctly-formed replacements — and closing them to free the slots
    # permanently suppresses those versions. See docs/operations/repo-security.md.
    open-pull-requests-limit: 5
    # Deploys fire ONLY on release-please PR merges, and release-please hides `chore` and
    # bumps nothing for it. A production-dependency security patch committed as chore(deps)
    # would land on main and never reach Cloudflare. `fix` opens the release PR; merging it
    # is still a human decision, so the promotion gate is preserved — it can just SEE the fix.
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Security updates are UNGROUPED by default — one PR per advisory. Against the backlog
      # this repo carried in 2026-08 that would have been roughly twenty PRs in a morning.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # @types/node MUST track mise.toml's node pin rather than float ahead of it. Dependabot
      # cannot see mise.toml. Typing a runtime you do not run is how code typechecks and then
      # fails on an API the pinned runtime lacks — this repo shipped ^25 against a node 22 pin.
      # Unblock: raise `node` in mise.toml AND .nvmrc first, then raise this range in the SAME
      # commit. The next major after the blocked one still arrives, which is the re-evaluation
      # point.
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  # `directory: /` scans .github/workflows/ and NOTHING ELSE. Composite actions under
  # .github/actions/*/action.yml need their own entry, one per directory. None exist today;
  # packages/repo-guards fails the build if one appears without an entry here.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: [minor, patch]
